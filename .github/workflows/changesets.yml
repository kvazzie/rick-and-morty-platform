name: Prepare release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changesets-dev
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Changesets version PR
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - name: Install locked dependencies
        run: vp env exec --node 24 --package-manager pnpm@10.29.3 -- vp install --frozen-lockfile
      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: vp run --no-cache release:version
          commit-message: 'chore(release): version the platform'
          pr-title: 'chore(release): version the platform'
          pr-base-branch: dev
          create-github-releases: false
          push-git-tags: false
      - name: Run authoritative checks on the version pull request
        if: ${{ steps.changesets.outputs.pr-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          gh workflow run quality.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
